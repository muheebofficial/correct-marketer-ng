  <rect width="1200" height="1600" fill="#0E4837"/>
  <rect x="18" y="18" width="1164" height="1564" rx="0" fill="none" stroke="#D9A63E" stroke-width="4"/>

  <circle cx="970" cy="1220" r="470" fill="#1B664F" opacity="0.42"/>
  <circle cx="1060" cy="1360" r="400" fill="#1B664F" opacity="0.32"/>
  <circle cx="-50" cy="1240" r="430" fill="#1B664F" opacity="0.28"/>

  <g fill="#D9A63E" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2">
